
name: CI - Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      GOOGLE_API_KEY: dummy-key-for-mocked-tests
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: app_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Crear tablas con Alembic
        run: python -m alembic upgrade head

      - name: Ejecutar Ruff
        run: python -m ruff check .

      - name: Tests sin Gemini real
        run: python -m pytest -q -m "not live_llm" tests/

      - name: Tests con Gemini real
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY_TEST }}
          RUN_LIVE_LLM_TESTS: "1"
        run: python -m pytest -q -m "live_llm" tests/
