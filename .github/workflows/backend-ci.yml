name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      GOOGLE_API_KEY: dummy-key-for-mocked-tests
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: app_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create tables with Alembic
        run: python -m alembic upgrade head

      - name: Execute Ruff
        run: python -m ruff check .

      - name: Execute tests
        run: python -m pytest -q -m "not live_llm" tests/


  live-llm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: tests

    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      GOOGLE_API_KEY: dummy-key-for-mocked-tests
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: app_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Real Gemini tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY_TEST }}
          RUN_LIVE_LLM_TESTS: "1"
        run: python -m pytest -q -m "live_llm" tests/
      
  build-backend:
    name: Build backend image / Push ECR
    needs: [tests, live-llm]

    if: >-
      ${{
      always() &&
      needs.tests.result == 'success' &&
      (
      github.event_name == 'pull_request' ||
      needs['live-llm'].result == 'success'
      )
      }} 

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build \
          -t tfg-backend:${{github.sha}} \
          ./backend
      
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::327745426795:role/GitHubActionsTFGRole
          aws-region: eu-south-2

      - name: ECR Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Push backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
        run: |
          docker tag \
          tfg-backend:${{github.sha}} \
          $ECR_REGISTRY/tfg/backend:${{github.sha}}

          docker push \
          $ECR_REGISTRY/tfg/backend:${{github.sha}}
  
  build-frontend:
    name: Build frontend image
    needs: [tests, live-llm]

    if: >-
      ${{
      always() &&
      needs.tests.result == 'success' &&
      (
      github.event_name == 'pull_request' ||
      needs['live-llm'].result == 'success'
      )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Build frontend image
        run: |
          docker build \
          --build-arg VITE_API_URL=/api \
          -t tfg-frontend:${{github.sha}} \
          ./frontend
      
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::327745426795:role/GitHubActionsTFGRole
          aws-region: eu-south-2

      - name: ECR Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Push frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
        run: |
          docker tag \
          tfg-frontend:${{github.sha}} \
          $ECR_REGISTRY/tfg/frontend:${{github.sha}}

          docker push \
          $ECR_REGISTRY/tfg/frontend:${{github.sha}}




